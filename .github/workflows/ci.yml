name: CI/CD Pipeline

on:
  push:
    branches: [ "dev", "qa", "master", "development", "develop", "main" ]
  pull_request:
    branches: [ "dev", "qa", "master", "development", "develop", "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer

      - name: Install Dependencies
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env.ci
        run: cp .env.ci .env

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute Tests with Coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Check Coverage Minimum (50%)
        run: |
          # A simple script or check to enforce 50% coverage. 
          # Alternatively, php artisan test --coverage --min=50 is available in recent Laravel
          php artisan test --coverage --min=50

      - name: Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Linting (Pint)
        run: ./vendor/bin/pint --test

  deploy-simulation:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      # Optional environment block for manual approval on master
      name: ${{ github.ref == 'refs/heads/master' && 'production' || (github.ref == 'refs/heads/qa' && 'uat' || 'development') }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Environment Variables and Deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_NAME="production"
            ENV_FILE=".env.prod"
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]] || [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            ENV_NAME="uat"
            ENV_FILE=".env.uat"
          else
            ENV_NAME="development"
            ENV_FILE=".env.dev"
          fi
          
          cp $ENV_FILE .env
          echo "Deploying to $ENV_NAME with $ENV_FILE"

      - name: Notify Maintainers
        run: |
          echo "Sending notification to maintainers: Pipeline succeeded for branch ${{ github.ref }}!"
