name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "dev", "qa", "master", "development", "develop", "main", "uat" ]

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/master", "refs/heads/main", "refs/heads/dev", "refs/heads/development", "refs/heads/develop", "refs/heads/qa", "refs/heads/uat"]'), github.ref)
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer

      - name: Install Dependencies
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Copy .env.ci
        run: cp .env.ci .env

      - name: Generate key
        run: php artisan key:generate

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Execute Tests with Coverage
        run: php artisan test --coverage --min=50

  static_analysis:
    name: Статический анализ кода
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/master", "refs/heads/main", "refs/heads/dev", "refs/heads/development", "refs/heads/develop", "refs/heads/qa", "refs/heads/uat"]'), github.ref)
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Dependencies
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=2G

  linting:
    name: Linting
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(fromJSON('["refs/heads/master", "refs/heads/main", "refs/heads/dev", "refs/heads/development", "refs/heads/develop", "refs/heads/qa", "refs/heads/uat"]'), github.ref)
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install Dependencies
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Linting (Pint)
        run: vendor/bin/pint --test

  deploy_simulation:
    name: Симуляция деплоя
    needs: [tests, static_analysis, linting]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/master", "refs/heads/main", "refs/heads/dev", "refs/heads/development", "refs/heads/develop", "refs/heads/qa", "refs/heads/uat"]'), github.ref)
    environment:
      name: ${{ contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref) && 'production' || (contains(fromJSON('["refs/heads/qa", "refs/heads/uat"]'), github.ref) && 'uat' || 'development') }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup Environment Variables and Deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_NAME="production"
            ENV_FILE=".env.prod"
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]] || [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            ENV_NAME="uat"
            ENV_FILE=".env.uat"
          else
            ENV_NAME="development"
            ENV_FILE=".env.dev"
          fi
          
          cp $ENV_FILE .env
          echo "Deploying to $ENV_NAME with $ENV_FILE"

      - name: Notify Maintainers
        run: |
          echo "Sending notification to maintainers: Pipeline succeeded for branch ${{ github.ref }}!"
